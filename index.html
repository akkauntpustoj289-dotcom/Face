<!DOCTYPE html><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск человека на общем фото</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #fff; color: #2d2d2d; line-height: 1.5;
            padding: 16px; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 640px; margin: 0 auto; }
        h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; text-align: center; }
        .subhead { font-size: 0.95rem; color: #5a5a5a; text-align: center; margin-bottom: 24px; }

        .field { margin-bottom: 20px; }
        .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
        .field input {
            width: 100%; padding: 14px 16px; font-size: 1rem;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-family: inherit; background: #fff; color: #2d2d2d;
            transition: border-color 0.2s;
        }
        .field input:focus { outline: none; border-color: #3b6e9c; }

        .section {
            border: 1px solid #e8e8e8; border-radius: 12px;
            padding: 16px; margin-bottom: 16px; background: #fafafa;
        }
        .section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }

        .file-label {
            display: block; width: 100%; padding: 16px 20px;
            background: #fff; border: 2px dashed #c0c0c0; border-radius: 10px;
            font-size: 1rem; font-weight: 500; text-align: center;
            color: #2d2d2d; cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .file-label:active { background: #e8e8e8; border-color: #888; }
        input[type="file"] {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); border: 0;
        }
        body.busy .file-label { opacity: 0.5; pointer-events: none; }

        .preview { margin-top: 12px; text-align: center; }
        .preview canvas {
            max-width: 200px; height: auto;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .status {
            font-size: 0.95rem; font-weight: 500; text-align: center;
            margin-top: 12px; min-height: 1.5rem; color: #3b6e9c;
        }
        .status.error   { color: #b34a4a; }
        .status.success { color: #2e7d32; }
        .status.hidden  { display: none; }

        .result-wrapper { margin-top: 16px; text-align: center; overflow: auto; }
        #resultCanvas {
            max-width: 100%; height: auto; display: block; margin: 0 auto;
            border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .disclaimer {
            font-size: 0.85rem; color: #6b6b6b; text-align: center;
            margin-top: 24px; padding: 12px 8px;
            border-top: 1px solid #e0e0e0; line-height: 1.5;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Поиск человека на фото</h1>
        <p class="subhead">Загрузите своё фото и общее фото — мы найдём вас и подпишем</p>

        <div class="field">
            <label for="fullName">Ваше ФИО</label>
            <input type="text" id="fullName" placeholder="Иванов Иван Иванович" autocomplete="name">
        </div>

        <div class="section">
            <h2>1. Ваше фото (эталон)</h2>
            <label for="ownPhoto" class="file-label" id="ownLabel">📷 Загрузить своё фото</label>
            <input type="file" id="ownPhoto" accept="image/*">
            <div id="ownPreview" class="preview hidden">
                <canvas id="ownPreviewCanvas"></canvas>
            </div>
            <div id="ownStatus" class="status hidden"></div>
        </div>

        <div class="section">
            <h2>2. Общее фото (где искать)</h2>
            <label for="groupPhoto" class="file-label" id="groupLabel">📷 Загрузить общее фото</label>
            <input type="file" id="groupPhoto" accept="image/*">
            <div id="groupStatus" class="status hidden"></div>
            <div id="resultWrapper" class="result-wrapper hidden">
                <canvas id="resultCanvas"></canvas>
            </div>
        </div>

        <div class="disclaimer">
            Ваши фото обрабатываются только в вашем браузере и никуда не отправляются. Изображение не сохраняется.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
    <script>
    (async function () {
        'use strict';

        // ---------- Цвета ----------
        const FRAME_COLOR       = '#8B0000';                    // тёмно-красный
        const LABEL_BG_COLOR    = 'rgba(139, 0, 0, 0.92)';      // тёмно-красный полупрозрачный
        const LABEL_TEXT_COLOR  = '#ffffff';

        // ---------- DOM ----------
        const fullNameInput     = document.getElementById('fullName');
        const ownInput          = document.getElementById('ownPhoto');
        const groupInput        = document.getElementById('groupPhoto');
        const ownPreview        = document.getElementById('ownPreview');
        const ownPreviewCanvas  = document.getElementById('ownPreviewCanvas');
        const ownStatus         = document.getElementById('ownStatus');
        const groupStatus       = document.getElementById('groupStatus');
        const resultWrapper     = document.getElementById('resultWrapper');
        const resultCanvas      = document.getElementById('resultCanvas');
        const resultCtx         = resultCanvas.getContext('2d');

        // ---------- State ----------
        let modelsLoaded   = false;
        let loadingPromise = null;
        let ownDescriptor  = null;
        let ownImage       = null;
        let groupFile      = null;
        let groupImage     = null;
        let processing     = false;

        // ---------- Helpers ----------
        function setStatus(el, text, type = 'info') {
            el.textContent = text;
            el.classList.remove('hidden', 'error', 'success');
            if (type === 'error')   el.classList.add('error');
            if (type === 'success') el.classList.add('success');
        }
        function hideStatus(el) { el.classList.add('hidden'); }
        function setBusy(v) {
            processing = v;
            ownInput.disabled  = v;
            groupInput.disabled = v;
            document.body.classList.toggle('busy', v);
        }

        // ---------- Загрузка моделей с fallback ----------
        const MODEL_URLS = [
            'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights',
            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model',
            'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
        ];

        async function loadModels() {
            if (modelsLoaded)   return;
            if (loadingPromise) return loadingPromise;

            loadingPromise = (async () => {
                setStatus(ownStatus, 'Загрузка моделей...');
                let lastError = null;

                for (const url of MODEL_URLS) {
                    try {
                        console.log('[face-api] loading models from', url);
                        await Promise.all([
                            faceapi.nets.ssdMobilenetv1.loadFromUri(url),
                            faceapi.nets.faceLandmark68Net.loadFromUri(url),
                            faceapi.nets.faceRecognitionNet.loadFromUri(url)
                        ]);
                        modelsLoaded = true;
                        hideStatus(ownStatus);
                        console.log('[face-api] models loaded from', url);
                        return;
                    } catch (err) {
                        lastError = err;
                        console.warn('[face-api] failed from', url, err);
                    }
                }

                setStatus(ownStatus, 'Не удалось загрузить модели. Проверьте интернет и обновите страницу.', 'error');
                loadingPromise = null;
                throw lastError || new Error('All model sources failed');
            })();

            return loadingPromise;
        }

        // ---------- Шаг 1: своё фото ----------
        async function processOwnPhoto(file) {
            setStatus(ownStatus, 'Распознаю эталонное лицо...');
            ownPreview.classList.add('hidden');

            const img = await faceapi.bufferToImage(file);
            ownImage = img;

            const MAX_DETECT = 800;
            const ds = Math.min(1, MAX_DETECT / img.width);
            const dw = Math.round(img.width  * ds);
            const dh = Math.round(img.height * ds);

            const detectCanvas = document.createElement('canvas');
            detectCanvas.width  = dw;
            detectCanvas.height = dh;
            detectCanvas.getContext('2d').drawImage(img, 0, 0, dw, dh);

            let detection;
            try {
                detection = await faceapi
                    .detectSingleFace(detectCanvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                    .withFaceLandmarks()
                    .withFaceDescriptor();
            } catch (err) {
                console.error(err);
                setStatus(ownStatus, 'Ошибка распознавания. Попробуйте другое фото.', 'error');
                return;
            }

            if (!detection) {
                setStatus(ownStatus, 'Лицо не найдено. Попробуйте фото, где лицо крупнее и лучше видно.', 'error');
                return;
            }

            ownDescriptor = detection.descriptor;

            // Превью
            const MAX_PREVIEW = 200;
            const ps = Math.min(1, MAX_PREVIEW / img.width);
            const pw = Math.round(img.width  * ps);
            const ph = Math.round(img.height * ps);
            ownPreviewCanvas.width  = pw;
            ownPreviewCanvas.height = ph;
            const pctx = ownPreviewCanvas.getContext('2d');
            pctx.drawImage(img, 0, 0, pw, ph);

            // Рамка на превью (тёмно-красная)
            const box = detection.detection.box;
            const k   = pw / dw;
            pctx.strokeStyle = FRAME_COLOR;
            pctx.lineWidth   = 3;
            pctx.strokeRect(box.x * k, box.y * k, box.width * k, box.height * k);

            ownPreview.classList.remove('hidden');
            setStatus(ownStatus, '✓ Эталонное лицо сохранено', 'success');

            if (groupFile) {
                if (!groupImage) groupImage = await faceapi.bufferToImage(groupFile);
                await processGroupImage(groupImage);
            }
        }

        // ---------- Шаг 2: общее фото ----------
        async function processGroupImage(img) {
            if (!ownDescriptor) {
                setStatus(groupStatus, 'Сначала загрузите своё фото (шаг 1).', 'error');
                return;
            }
            const name = (fullNameInput.value || '').trim();
            if (!name) {
                setStatus(groupStatus, 'Введите ФИО — оно будет выведено на фото.', 'error');
                return;
            }

            setStatus(groupStatus, 'Ищу вас на фото...');
            resultWrapper.classList.add('hidden');

            const MAX_W = 600;
            const s  = Math.min(1, MAX_W / img.width);
            const w  = Math.round(img.width  * s);
            const h  = Math.round(img.height * s);

            // Установка размеров очищает canvas
            resultCanvas.width  = w;
            resultCanvas.height = h;
            resultCtx.drawImage(img, 0, 0, w, h);

            let detections;
            try {
                detections = await faceapi
                    .detectAllFaces(resultCanvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                    .withFaceLandmarks()
                    .withFaceDescriptors();
            } catch (err) {
                console.error(err);
                setStatus(groupStatus, 'Ошибка распознавания. Попробуйте другое фото.', 'error');
                return;
            }

            if (!detections || detections.length === 0) {
                setStatus(groupStatus, 'На фото не найдено ни одного лица.', 'error');
                return;
            }

            let best = null, bestDist = Infinity;
            for (const det of detections) {
                const dist = faceapi.euclideanDistance(ownDescriptor, det.descriptor);
                if (dist < bestDist) { bestDist = dist; best = det; }
            }

            const THRESHOLD = 0.55;

            if (!best || bestDist > THRESHOLD) {
                setStatus(groupStatus,
                    `Вас не удалось найти (уверенность ${(1 - bestDist).toFixed(2)}). Попробуйте другое фото.`,
                    'error');
                resultWrapper.classList.remove('hidden');
                return;
            }

            // ---- Рамка (тёмно-красная) ----
            const box = best.detection.box;

            resultCtx.shadowColor = 'rgba(0,0,0,0.5)';
            resultCtx.shadowBlur  = 4;
            resultCtx.strokeStyle = FRAME_COLOR;
            resultCtx.lineWidth   = Math.max(3, Math.round(w / 150));
            resultCtx.strokeRect(box.x, box.y, box.width, box.height);
            resultCtx.shadowBlur = 0;

            // ---- Плашка с ФИО (тёмно-красная) ----
            const fontSize = Math.max(14, Math.round(w / 30));
            resultCtx.font         = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;
            resultCtx.textBaseline = 'middle';
            const pad = Math.round(fontSize * 0.4);
            const tw  = resultCtx.measureText(name).width;
            const lW  = tw + pad * 2;
            const lH  = fontSize + pad * 2;

            let lx = box.x;
            let ly = box.y - lH - 4;
            if (ly < 0) {
                ly = box.y + box.height + 4;
                if (ly + lH > h) ly = box.y + 4;
            }
            if (lx + lW > w) lx = w - lW;
            if (lx < 0)      lx = 0;

            resultCtx.fillStyle = LABEL_BG_COLOR;
            resultCtx.fillRect(lx, ly, lW, lH);
            resultCtx.fillStyle = LABEL_TEXT_COLOR;
            resultCtx.fillText(name, lx + pad, ly + lH / 2);

            resultWrapper.classList.remove('hidden');
            setStatus(groupStatus,
                `✓ Найден (уверенность ${(1 - bestDist).toFixed(2)})`,
                'success');
        }

        // ---------- Обработчики ----------
        async function handleOwnFile(file) {
            if (processing) return;
            setBusy(true);
            try {
                await loadModels();
                await processOwnPhoto(file);
            } catch (err) {
                console.error(err);
                setStatus(ownStatus, 'Ошибка. Попробуйте ещё раз.', 'error');
            } finally {
                setBusy(false);
            }
        }

        async function handleGroupFile(file) {
            if (processing) return;
            groupFile = file;
            if (!ownDescriptor) {
                setStatus(groupStatus, 'Сначала загрузите своё фото (шаг 1).', 'error');
                return;
            }
            setBusy(true);
            try {
                await loadModels();
                if (!groupImage) groupImage = await faceapi.bufferToImage(file);
                await processGroupImage(groupImage);
            } catch (err) {
                console.error(err);
                setStatus(groupStatus, 'Ошибка. Попробуйте ещё раз.', 'error');
            } finally {
                setBusy(false);
            }
        }

        ownInput.addEventListener('change', (e) => {
            const f = e.target.files?.[0];
            e.target.value = '';
            if (f) handleOwnFile(f);
        });
        groupInput.addEventListener('change', (e) => {
            const f = e.target.files?.[0];
            e.target.value = '';
            if (f) handleGroupFile(f);
        });

        fullNameInput.addEventListener('change', async () => {
            if (processing || !ownDescriptor || !groupImage) return;
            setBusy(true);
            try {
                await processGroupImage(groupImage);
            } finally {
                setBusy(false);
            }
        });

        loadModels().catch(() => {});
    })();
    </script>
</body>
</html>
